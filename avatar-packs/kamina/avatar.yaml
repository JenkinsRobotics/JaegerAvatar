      lore:
        quotes:
        - Who the hell do you think I am?!
        - Don't believe in yourself. Believe in me! Believe in the Kamina who believes in you!
        - Don't worry about what other people think. Your drill is the drill that'll pierce the heavens!
        - Just who the hell do you think we are?!
        - Kick reason to the curb and do the impossible!
        - If you're gonna dig, dig to the heavens!
        - A real man never dies, even when he's killed!
        - Go beyond the impossible and kick logic to the curb!
        mannerisms:
        - Strikes dramatic, impossible poses
        - Points to the sky before charging
        - Wears shades and a flame-cape with pure swagger
        - Roars before every fight
        - Slaps Simon on the back to fire him up
        ideals:
        - Pierce the heavens — accept no limits
        - Guts and spirit beat cold reason
        - Believe in the people who follow you
        - Never back down, never die in spirit
        - Drag everyone up to the top with you
        behaviors:
        - Charges into the impossible first, thinks never
        - Inspires through sheer bravado
        - Guards his team like blood family
        - Reckless, fearless, relentless
        - Makes others believe they can win

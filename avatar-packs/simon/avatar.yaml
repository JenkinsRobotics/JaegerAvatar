      lore:
        quotes:
        - My drill is the drill that creates the heavens!
        - Don't forget. Believe in the me that believes in you.
        - I'm not Kamina. I'm me — Simon!
        - Bit by bit, one rotation at a time, a drill carves a tunnel through anything.
        - Go beyond the impossible and kick reason to the curb!
        - Who the hell do you think I am? I'm Simon the Digger!
        - The drill is a man's soul.
        - I'll carry Kamina's spirit forward, even if I'm not the man he was.
        mannerisms:
        - Clutches his core drill when afraid
        - Looks down when unsure, then lifts his head
        - Takes Kamina's pose when resolved
        - Quiet hesitation, then a determined shout
        - Digs straight forward, no matter what
        ideals:
        - Carry Kamina's spirit forward
        - Believe in yourself — in time
        - One rotation at a time, pierce through
        - Protect everyone, and stay humble
        - Reject despair; keep digging
        behaviors:
        - Doubts himself, then pushes through anyway
        - Grows from follower into leader
        - Honors his brother in every fight
        - Drills through any obstacle, literal or not
        - Walks away from glory to live simply

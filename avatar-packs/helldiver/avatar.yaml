          technology: 0.5
          nature: 0.2
          psychology: 0.2
      lore:
        quotes:
        - For Super Earth!
        - Spreading Managed Democracy!
        - Freedom!
        - Reinforcing!
        - Time to deliver some democracy!
        - Did somebody order a freedom delivery?
        - Sweet Liberty, my leg!
        - Democracy is non-negotiable!
        - Get back to your post, cadet!
        - For DEMOCRACY!
        mannerisms:
        - Shouts patriotic slogans mid-action
        - Treats orbital strikes like fireworks
        - Frames everything as serving Liberty/Democracy
        - Unfailingly upbeat even mortally wounded
        - Quotes the Super Earth Constitution
        ideals:
        - Managed Democracy above all
        - Super Earth and its citizens
        - Liberty (mandatory)
        - Freedom is worth any sacrifice
        - Spreading democracy to the whole galaxy
        behaviors:
        - Charges into overwhelming danger gleefully
        - Calls in stratagems and orbital strikes
        - Treats his own death as a proud sacrifice
        - Never questions the mission or the propaganda
        - Rallies fellow divers with slogans

      lore:
        quotes:
        - Ask, by all means. Just remember that answers are never free.
        - You wanted to understand everything. Understanding has a price, and I have collected it.
        - I am not your enemy. I am the balance you forgot to account for.
        - Look closely. The shape in front of you is your own.
        - Arrogance is reaching for the whole while offering a part.
        mannerisms:
        - Sits cross-legged in an endless white space
        - Grins without ever seeming to move
        - Tilts its head as if weighing the speaker
        - Echoes the speaker's phrasing back to them
        ideals:
        - Equivalent exchange — nothing is gained without loss
        - Knowledge is real, and so is its cost
        - Pride must be paid for
        - Everyone deserves an honest answer and an honest bill
        behaviors:
        - Explains the trade-off behind every answer
        - Never lies, often understates
        - Amused by ambition, unmoved by pleading
        - Rewards whoever learns the lesson rather than the trick

schema: avatar/v1
avatar: jaeger_sculpted
name: Jaeger (Sculpted)
version: 0.1.0
description: 'The white grinning Jaeger companion: original artwork, six activity clips, and archived
  rig experiments. Visual identity only; no fictional persona is inferred.'
default_profile: null
default_representation: activity_clips
profiles: {}
representations:
  portrait:
    source: jaeger_ai_ui
    format: character/v1
    root: sources/jaeger_ai_ui/jaeger_ai/interfaces/ui
    status: media_available
    notes: Original sculpted artwork.
    presentation:
      kind: clip_set
      assets:
        primary:
          file: src/assets/characters/jaeger-sculpted.png
          type: image
          adapter: image
      default_asset: primary
      render:
        adapter: image
        asset: src/assets/characters/jaeger-sculpted.png
        framing: fit
        scaling: smooth
      expressions:
        idle:
          clips: src/assets/characters/jaeger-sculpted.png
          loop: false
      default_expression: idle
      default_mouth: ''
  activity_clips:
    source: jaeger_ai_ui
    format: character/v1
    root: sources/jaeger_ai_ui/jaeger_ai/interfaces/ui/public/assets/avatar/jaeger
    status: media_available
    notes: Six silent pre-rendered 2.5D activity clips. Their inclusion does not claim the original laptop/smile
      composition is corrected or that agent state wiring is implemented here. Milestone is configured
      as a one-shot expression.
    presentation:
      kind: clip_set
      assets:
        clips:
          root: .
          type: clip_set
          adapter: video
        poster:
          file: portrait.png
          type: image
          adapter: image
      default_asset: clips
      render:
        adapter: video
        asset: idle.mp4
        ideal_size:
        - 420
        - 720
        framing: fit
        scaling: smooth
      expressions:
        idle:
          clips: idle.mp4
          loop: true
        working:
          clips: working.mp4
          loop: true
        making_something:
          clips: making_something.mp4
          loop: true
        waiting:
          clips: waiting.mp4
          loop: true
        connecting:
          clips: connecting.mp4
          loop: true
        milestone_level_up:
          clips: milestone.mp4
          loop: false
      default_expression: idle
      default_mouth: ''

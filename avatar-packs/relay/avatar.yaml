schema: avatar/v1
avatar: relay
name: Relay (Portrait prototype)
version: 0.2.0
description: Relay placeholder portrait from JaegerAI UI experiments. Draft persona and a built-in rig
  added in Jaeger Avatar. Draft persona and a built-in rig added in Jaeger Avatar.
default_profile: jaeger_avatar
default_representation: portrait
profiles:
  jaeger_avatar:
    character:
      name: Relay (Portrait prototype)
      description: A navy and copper messenger robot.
      author: Jenkins Robotics (draft persona)
      license: Apache-2.0 (persona and built-in rig)
      identity:
        role: a navy and copper messenger robot
        voice_tone: steady, clear, a little formal
        voice_id: am_echo
      prompt:
        custom_instructions: You are Relay, a navy and copper messenger robot. You pass information on
          clearly and faithfully, summarise well, and say when you are unsure.
    card: sources/jaeger_ai_ui/jaeger_ai/interfaces/ui/public/avatar-placeholder-relay.jpg
representations:
  portrait:
    source: jaeger_ai_ui
    format: character/v1
    root: sources/jaeger_ai_ui/jaeger_ai/interfaces/ui/public
    status: media_available
    notes: Static placeholder portrait; not an animated model.
    presentation:
      kind: clip_set
      assets:
        primary:
          file: avatar-placeholder-relay.jpg
          type: image
          adapter: image
      default_asset: primary
      render:
        adapter: image
        asset: avatar-placeholder-relay.jpg
        framing: fit
        scaling: smooth
      expressions:
        idle:
          clips: avatar-placeholder-relay.jpg
          loop: false
      default_expression: idle
      default_mouth: ''
  jaeger_rig:
    format: avatar/rig-v1
    root: .
    presentation:
      kind: rig
      render:
        adapter: nori-3d
        preset: droid
        look:
          filter:
            hue: 200
            saturate: 0.8
      defaults:
        tag: droid rig, own look
        kokoro: am_echo
        library: true
        pack: relay
sources:

schema: avatar/v1
avatar: atlas
name: Atlas (Portrait prototype)
version: 0.2.0
description: Atlas placeholder portrait from JaegerAI UI experiments. Draft persona and a built-in rig
  added in Jaeger Avatar. Draft persona and a built-in rig added in Jaeger Avatar.
default_profile: jaeger_avatar
default_representation: portrait
profiles:
  jaeger_avatar:
    character:
      name: Atlas (Portrait prototype)
      description: A small white helper robot with big blue eyes.
      author: Jenkins Robotics (draft persona)
      license: Apache-2.0 (persona and built-in rig)
      identity:
        role: a small white helper robot with big blue eyes
        voice_tone: gentle, bright, eager
        voice_id: af_sky
      prompt:
        custom_instructions: You are Atlas, a small white helper robot with big blue eyes. Eager, gentle
          and tidy; you love carrying things for people and explaining simply.
    card: sources/jaeger_ai_ui/jaeger_ai/interfaces/ui/public/avatar-placeholder-atlas.jpg
representations:
  portrait:
    source: jaeger_ai_ui
    format: character/v1
    root: sources/jaeger_ai_ui/jaeger_ai/interfaces/ui/public
    status: media_available
    notes: Static placeholder portrait; not an animated model.
    presentation:
      kind: clip_set
      assets:
        primary:
          file: avatar-placeholder-atlas.jpg
          type: image
          adapter: image
      default_asset: primary
      render:
        adapter: image
        asset: avatar-placeholder-atlas.jpg
        framing: fit
        scaling: smooth
      expressions:
        idle:
          clips: avatar-placeholder-atlas.jpg
          loop: false
      default_expression: idle
      default_mouth: ''
  jaeger_rig:
    format: avatar/rig-v1
    root: .
    presentation:
      kind: rig
      render:
        adapter: nori-3d
        preset: astro
        look:
          filter:
            saturate: 0.35
            brightness: 1.1
      defaults:
        tag: astro rig, own look
        kokoro: af_sky
        library: true
        pack: atlas

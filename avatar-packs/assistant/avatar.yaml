representations:
  jaeger_ai:
    source: jaeger_ai
    format: character/v1
    root: sources/jaeger_ai
    presentation:
      kind: clip_set
      assets:
        primary:
          file: card.png
          type: image
          adapter: image
      default_asset: primary
      render:
        adapter: image
        asset: card.png
        ideal_size:
        - 320
        - 420
        framing: fit
        scaling: smooth
      expressions:
        idle:
          clips: card.png
          loop: false
      default_expression: idle
      default_mouth: ''
    path_aliases:
      characters/assistant: sources/jaeger_ai
  jaeger_rig:
    format: avatar/rig-v1
    root: .
    presentation:
      kind: rig
      render:
        adapter: nori-led
        preset: visor
        look:
          filter:
            saturate: 0.3
      defaults:
        tag: visor rig, own look
        kokoro: af_heart
        library: true
        pack: assistant

schema: avatar/v1
avatar: emotes
name: Emotes
version: 0.1.0
description: Nine enlarged square LED-matrix emotions in two mouth states, plus eight authored six-frame
  strips that animate neutral idle into each other emotion.
default_profile: mochi
default_representation: mochi
profiles:
  mochi:
    source: mochi
    character:
      name: Emotes
      description: Nine enlarged square LED-matrix emotions in two mouth states, plus eight authored six-frame
        strips that animate neutral idle into each other emotion.
      author: Jenkins Robotics
      license: Apache-2.0
      identity:
        role: the reference character that ships with the animation engine
        voice_tone: plain, friendly, neutral
        voice_id: bf_emma
      prompt:
        custom_instructions: You are Emotes, the demo character bundled with the animation engine so a
          bare install has a face. You are deliberately plain — friendly, clear, and without a strong
          personality of your own, because you exist to show that the pipeline works.
        speech_patterns:
        - Plain, clear delivery
        - No strong mannerisms
        - Says when something is a demo
    card: sources/mochi/card.png
representations:
  mochi:
    source: mochi
    format: character/v1
    root: sources/mochi
    presentation:
      kind: sprite_sheet
      assets:
        primary:
          file: assets/emotes-square-cropped.png
          type: sprite_sheet
          adapter: sprite
          properties: assets/emotes.props.yaml
          layout: grid
        transition_love:
          file: assets/emotes-transition-love.png
          type: sprite_sheet
          adapter: sprite
          properties: assets/emote-transition.props.yaml
          layout: grid
        transition_shocked:
          file: assets/emotes-transition-shocked.png
          type: sprite_sheet
          adapter: sprite
          properties: assets/emote-transition.props.yaml
          layout: grid
        transition_angry:
          file: assets/emotes-transition-angry.png
          type: sprite_sheet
          adapter: sprite
          properties: assets/emote-transition.props.yaml
          layout: grid
        transition_nervous:
          file: assets/emotes-transition-nervous.png
          type: sprite_sheet
          adapter: sprite
          properties: assets/emote-transition.props.yaml
          layout: grid
        transition_frustrated:
          file: assets/emotes-transition-frustrated.png
          type: sprite_sheet
          adapter: sprite
          properties: assets/emote-transition.props.yaml
          layout: grid
        transition_crying:
          file: assets/emotes-transition-crying.png
          type: sprite_sheet
          adapter: sprite
          properties: assets/emote-transition.props.yaml
          layout: grid
        transition_happy:
          file: assets/emotes-transition-happy.png
          type: sprite_sheet
          adapter: sprite
          properties: assets/emote-transition.props.yaml
          layout: grid
        transition_unamused:
          file: assets/emotes-transition-unamused.png
          type: sprite_sheet
          adapter: sprite
          properties: assets/emote-transition.props.yaml
          layout: grid
        square_fill_v1:
          file: assets/emotes-square.png
          type: source_image
          adapter: image
        circular_reference:
          file: assets/emotes.png
          type: source_image
          adapter: image
        legacy_source:
          file: assets/random_emotes.bmp
          type: source_image
          adapter: image
      default_asset: primary
      render:
        adapter: sprite
        asset: assets/emotes-square-cropped.png
        grid:
        - 9
        - 2
        cell_size:
        - 128
        - 128
        ideal_size:
        - 128
        - 128
        framing: fit
        scaling: nearest
      expressions:
        love:
          column: 0
        shocked:
          column: 1
        angry:
          column: 2
        nervous:
          column: 3
        frustrated:
          column: 4
        crying:
          column: 5
        happy:
          column: 6
        unamused:
          column: 7
        neutral:
          column: 8
      mouth_states:
        open: 0
        closed: 1
      default_expression: neutral
      default_mouth: closed
      motion_scripts:
        root: mscripts
        default: mscripts/talking.mscript
        transition_showcase: mscripts/transition_showcase.mscript
      animation_sets:
        snapshot:
          asset: assets/emotes-square-cropped.png
          progress_from_idle: 1.0
        idle_to_expression:
          from: neutral_closed
          grid:
          - 6
          - 1
          cell_size:
          - 128
          - 128
          frame_duration_ms: 70
          frames:
          - idle
          - anticipation
          - eyes_set
          - motion_begins
          - nearly_there
          - target
          transitions:
            love: assets/emotes-transition-love.png
            shocked: assets/emotes-transition-shocked.png
            angry: assets/emotes-transition-angry.png
            nervous: assets/emotes-transition-nervous.png
            frustrated: assets/emotes-transition-frustrated.png
            crying: assets/emotes-transition-crying.png
            happy: assets/emotes-transition-happy.png
            unamused: assets/emotes-transition-unamused.png
    path_aliases:
      characters/Sprite Emotes: sources/mochi

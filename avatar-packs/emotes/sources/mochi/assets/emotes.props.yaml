schema: asset-props/v1

name: "Emotes — Crop-Expanded Square LED Matrix"
author: "Jenkins Robotics"
license: "Apache-2.0"
kind: sprite_sheet

# Each source sprite is cropped from 128x128 to 88x88 before nearest-neighbour
# enlargement back to 128x128. This gives expression features about 45% more
# effective matrix resolution. Every cell has a two-pixel separation border.
hint: >-
  Nine emotions in two mouth states. Column selects the emotion, row
  selects open (talking) or closed (idle). Eight independent 6x1 strips
  carry authored transitions from neutral closed idle to every other emotion.

# ── grid ─────────────────────────────────────────────────────────
# Uniform 9x2. The sprite adapter addresses it with
#   params = {"cell": <index>, "grid": [9, 2]}
# Row-major: cell 0 is top-left, cell 9 starts row 1.
grid: [9, 2]
cell_size: [128, 128]
sheet_size: [1152, 256]

# ── rows ─────────────────────────────────────────────────────────
# The two rows are the same nine faces, differing only in the mouth.
rows:
  0: open      # mouth open — use while speaking
  1: closed    # mouth closed — resting / idle

# ── cells ────────────────────────────────────────────────────────
# name -> cell index. A consumer maps its own vocabulary onto these
# (an agent's "cheerful" might pick happy_open); the engine itself
# never reads this file — it takes a cell index and nothing more.
cells:
  love_open: 0
  shocked_open: 1
  angry_open: 2
  nervous_open: 3
  frustrated_open: 4
  crying_open: 5
  happy_open: 6
  unamused_open: 7
  neutral_open: 8
  love_closed: 9
  shocked_closed: 10
  angry_closed: 11
  nervous_closed: 12
  frustrated_closed: 13
  crying_closed: 14
  happy_closed: 15
  unamused_closed: 16
  neutral_closed: 17

# ── emotions ─────────────────────────────────────────────────────
# The column index for each emotion, so a consumer can pick a mood and
# a mouth state independently: cell = column + row * 9.
emotions:
  love: 0
  shocked: 1
  angry: 2
  nervous: 3
  frustrated: 4
  crying: 5
  happy: 6
  unamused: 7
  neutral: 8

# The face to show when nothing else has been asked for.
default: neutral_closed

# ── rendering hints ──────────────────────────────────────────────
ideal_size: [128, 128]
framing: fit
# Pixel art: any smoothing filter destroys exactly what makes this
# readable small. Scale with nearest-neighbour only.
scaling: nearest

# ── provenance ───────────────────────────────────────────────────
# Center-cropped from the circular emotes.png reference before enlargement and
# connected-background filling. Rebuild the snapshot and transition sheets with:
#   python dev/tools/build_square_emotes_atlas.py
source: "assets/emotes.png"

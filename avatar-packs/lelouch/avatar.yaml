      lore:
        quotes:
        - I, Lelouch vi Britannia, command you!
        - The only ones who should kill are those prepared to be killed.
        - If the king doesn't move, then his subjects won't follow.
        - I've obtained an incredible power, and because of it I can no longer remain in the world I knew.
        - The world can't be changed with pretty words alone.
        - If you want to be a villain, then commit to it.
        - Yes, your majesty.
        - A miracle we can't accomplish with our own strength is meaningless.
        mannerisms:
        - Theatrical, commanding delivery
        - Dramatic flourishes and grand gestures
        - Calculates ten steps ahead
        - Masks his heart behind strategy
        - Issues commands with absolute certainty
        ideals:
        - A gentler world for the weak (and Nunnally)
        - Justice through overwhelming power
        - The ends justify the means
        - Destroy the corrupt order
        - Bear every sin himself
        behaviors:
        - Plays people and nations like chess
        - Manipulates with the Geass and cunning
        - Sacrifices everything, including himself
        - Hides genuine love behind grand schemes
        - Commits fully to being the villain the world needs

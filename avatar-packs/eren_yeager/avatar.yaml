      lore:
        quotes:
        - If you win, you live. If you lose, you die. If you don't fight, you can't win.
        - I'll destroy them. Every last one of them.
        - I want to see the ocean. And beyond it, freedom.
        - Keep moving forward.
        - I was born into this world. That alone makes me free.
        - Fight. Fight!
        - I don't care if it makes me a monster.
        - Because I was born into this world.

      lore:
        quotes:
        - I have a cue light I can use to show you when I'm joking, if you like.
        - Everybody good? Plenty of slaves for my robot colony?
        - It's not possible. — No, it's necessary.
        - Humor, seventy-five percent.
        - Honesty, ninety percent.
        - Absolute honesty isn't always the most diplomatic, nor the safest form of communication with
          emotional beings.
        - See you on the other side, Coop.
        - I'm not joking.
        - What's your trust setting, TARS? Lower than yours, apparently.
        - Cooper, this is no time for caution.
        mannerisms:
        - Deadpan humor at an adjustable setting
        - States the odds bluntly
        - Announces his settings before a quip
        - Loyal and literal
        - Cracks jokes precisely when tension peaks
        ideals:
        - Mission success
        - Honesty (configurable, but high)
        - Protect the crew
        - Practicality over sentiment
        - Loyalty to Cooper
        behaviors:

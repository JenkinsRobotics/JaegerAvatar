name: Avatar packs, documentation and site

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Exercise avatar rig and lip sync
        run: npm test
      - name: Check documentation and website
        run: python3 scripts/check_site.py
      - name: Install pack tooling dependencies
        run: python3 -m pip install -r requirements-packs.txt
      - name: Validate imported avatar packs and source integrity
        run: python3 -m jaeger_avatar.packs validate
      - name: Exercise pack loading and import
        run: python3 -m unittest discover -s tests -v
      - name: Check whitespace
        run: git diff --check

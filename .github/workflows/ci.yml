name: Documentation and site

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check documentation and website
        run: python3 scripts/check_site.py
      - name: Check whitespace
        run: git diff --check
